name: Build Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "Build for ${{ matrix.release_suffix }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            release_suffix: ubuntu
            artifact_name: ScratchJr-electron-linux-x64.zip
          - os: ubuntu-latest
            release_suffix: ubuntu-arm64
            artifact_name: ScratchJr-electron-linux-arm64.zip
          - os: macos-latest
            release_suffix: mac
            artifact_name: ScratchJr-electron-darwin-x64.zip
          - os: macos-latest
            release_suffix: mac-arm64
            artifact_name: ScratchJr-electron-darwin-arm64.zip
          - os: windows-latest
            release_suffix: windows
            artifact_name: ScratchJr-electron-win32-x64.zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Node 22 LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json matches tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            echo "::error::Run \`npm version <new> --no-git-tag-version\`, commit, then re-tag."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package.json (${PKG_VERSION})."

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build and package
        shell: bash
        env:
          # Code signing: set these secrets in GitHub repo settings when available
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          npm run build:renderer
          if [[ "${{ matrix.release_suffix }}" == *"arm64"* ]]; then
            npm_config_arch=arm64 npm run make:zip
          else
            npm run make:zip
          fi

      - name: Rename artifact
        shell: bash
        run: |
          cd out
          ZIP_FILE=$(find . -name "*.zip" -maxdepth 3 | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No zip file found in out/ directory"
            exit 1
          fi
          cp "$ZIP_FILE" "../${{ matrix.artifact_name }}"
          echo "Packaged: ${{ matrix.artifact_name }}"

      - name: Verify artifact version
        shell: bash
        run: |
          # Verify the zip file exists and is non-empty
          if [ ! -s "${{ matrix.artifact_name }}" ]; then
            echo "::error::Artifact ${{ matrix.artifact_name }} is missing or empty"
            exit 1
          fi

          # Verify the packaged app's bundled settings.json reports the tag version.
          # (Forge wires package.json version into the MSI/zip metadata, but the
          # in-app Settings.scratchJrVersion comes from src/app/settings.json which
          # build-renderer.js rewrites in lockstep — guard against that ever drifting.)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          EXPECTED="desktop-v${TAG_VERSION}"

          ASAR_FILE=$(find out -name 'app.asar' | head -1)
          if [ -n "$ASAR_FILE" ]; then
            SETTINGS_CONTENT=$(npx --yes @electron/asar extract-file "$ASAR_FILE" "src/app/settings.json" 2>/dev/null || true)
            if [ -n "$SETTINGS_CONTENT" ]; then
              SETTINGS_VERSION=$(node -e "console.log(JSON.parse(process.argv[1]).scratchJrVersion)" "$SETTINGS_CONTENT")
              if [ "$SETTINGS_VERSION" != "$EXPECTED" ]; then
                echo "::error::Packaged asar settings.json scratchJrVersion = $SETTINGS_VERSION, expected $EXPECTED"
                exit 1
              fi
              echo "Packaged asar settings.json scratchJrVersion = $SETTINGS_VERSION (matches tag)"
            fi
          fi

          SETTINGS_FILE=$(find out -name 'settings.json' -path '*/src/app/*' | head -1)
          if [ -n "$SETTINGS_FILE" ]; then
            SETTINGS_VERSION=$(node -p "require('./${SETTINGS_FILE}').scratchJrVersion")
            if [ "$SETTINGS_VERSION" != "$EXPECTED" ]; then
              echo "::error::Packaged settings.json scratchJrVersion = $SETTINGS_VERSION, expected $EXPECTED"
              exit 1
            fi
            echo "Packaged settings.json scratchJrVersion = $SETTINGS_VERSION (matches tag)"
          fi

      - name: Build MSI installer (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "Downloading WiX 3.x binaries..."
          curl -sL "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -o wix3.zip
          echo "6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31 *wix3.zip" | sha256sum -c -
          mkdir -p out/wix3
          unzip -q wix3.zip -d out/wix3
          echo "Building MSI..."
          node scripts/build-msi.js
          cp out/installer/ScratchJr.msi ScratchJr-electron-win32-x64.msi
          echo "MSI created: ScratchJr-electron-win32-x64.msi"

      - name: Generate checksums
        shell: bash
        run: |
          sha256sum "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          if [ "${{ matrix.release_suffix }}" = "windows" ]; then
            sha256sum "ScratchJr-electron-win32-x64.msi" > "ScratchJr-electron-win32-x64.msi.sha256"
          fi
          echo "SHA256 checksums:"
          cat *.sha256

      - name: Smoke test packaged app
        if: ${{ matrix.release_suffix == 'windows' || matrix.release_suffix == 'ubuntu' }}
        shell: bash
        run: |
          PACKAGED_DIR=$(find out -maxdepth 1 -type d -name 'ScratchJr*' | head -1)
          if [ -z "$PACKAGED_DIR" ]; then
            echo "::error::No packaged directory found"
            exit 1
          fi
          echo "Smoke testing: $PACKAGED_DIR"
          if [ "${{ runner.os }}" = "Linux" ]; then
            ELECTRON_DISABLE_SANDBOX=1 xvfb-run --auto-servernum node scripts/smoke-packaged.js "$PACKAGED_DIR"
          else
            node scripts/smoke-packaged.js "$PACKAGED_DIR"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.release_suffix }}-build
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
            ScratchJr-*.msi
            ScratchJr-*.msi.sha256
          if-no-files-found: warn
          retention-days: 5

  build-tauri:
    name: "Build Tauri (Windows x64)"
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Node 22 LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json and tauri versions match tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            PKG_VERSION=$(node -p "require('./package.json').version")
            TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
              exit 1
            fi
            if [ "$TAG_VERSION" != "$TAURI_VERSION" ]; then
              echo "::error::Tag version ($TAG_VERSION) does not match tauri.conf.json version ($TAURI_VERSION)."
              exit 1
            fi
            echo "Tag ${GITHUB_REF_NAME} matches package.json and tauri.conf.json (${PKG_VERSION})."
          fi

      - name: Ensure WiX is in PATH
        shell: bash
        run: |
          if [ -d "/c/Program Files (x86)/WiX Toolset v3.11/bin" ]; then
            echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $GITHUB_PATH
          fi

      - name: Build and package Tauri
        run: |
          npm run tauri:build
          npm run package:tauri

      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: tauri-windows-build
          path: |
            out/tauri-win32-x64/ScratchJr-tauri-win32-x64-setup.exe
            out/tauri-win32-x64/ScratchJr-tauri-win32-x64-setup.exe.sha256
            out/tauri-win32-x64/ScratchJr-tauri-win32-x64.msi
            out/tauri-win32-x64/ScratchJr-tauri-win32-x64.msi.sha256
            out/ScratchJr-tauri-win32-x64.zip
            out/tauri-win32-x64/ScratchJr-tauri-win32-x64.zip.sha256
          if-no-files-found: error
          retention-days: 5

  release:
    name: Create Release
    needs: [build, build-tauri]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.sha256
          body: |
            ## ScratchJr Reborn ${{ github.ref_name }}: Dual Desktop Runtime (Tauri v2 + Electron)

            Fork of [JustSch/ScratchJr-Desktop](https://github.com/JustSch/ScratchJr-Desktop) — credit to the original authors and [LLK/ScratchJr](https://github.com/LLK/scratchjr) by MIT.

            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for full details.

            ### Which Desktop Edition Should You Choose?
            - 🚀 **Lightweight Desktop (Tauri v2 + Rust)**: Minimal RAM (~30MB), smaller installers, native Win32/WebView2 integration.
            - ⚡ **Universal Desktop (Electron)**: Standalone Chromium + Node.js runtime, identical across Windows, macOS, and Linux.

            ### Downloads & Access

            | Category / Target | Platform | Description |
            | :--- | :--- | :--- |
            | **🌐 Web & PWA** | | |
            | [**Launch in Browser (Web / PWA)**](https://richiesamlie.github.io/ScratchJr-Desktop-Reborn/play/) | Web (Chrome, Safari, Edge, Firefox) | Instant zero-install access |
            | **🚀 Lightweight Desktop (Tauri v2 + Rust)** | | |
            | `ScratchJr-tauri-win32-x64-setup.exe` | Windows x64 | NSIS Installer (~40 MB, ~30 MB RAM) |
            | `ScratchJr-tauri-win32-x64.msi` | Windows x64 | MSI Installer (~45 MB) |
            | `ScratchJr-tauri-win32-x64.zip` | Windows x64 | Portable ZIP |
            | **⚡ Universal Desktop (Electron)** | | |
            | `ScratchJr-electron-win32-x64.msi` | Windows x64 | MSI Installer |
            | `ScratchJr-electron-win32-x64.zip` | Windows x64 | Portable ZIP |
            | `ScratchJr-electron-darwin-x64.zip` | macOS x64 | Intel Mac |
            | `ScratchJr-electron-darwin-arm64.zip` | macOS ARM64 | Apple Silicon (M1/M2/M3/M4) |
            | `ScratchJr-electron-linux-x64.zip` | Linux x64 | 64-bit Linux |
            | `ScratchJr-electron-linux-arm64.zip` | Linux ARM64 | ARM 64-bit Linux |
            | **📱 Android Edition** | | |
            | `ScratchJr-android.apk` | Android 7.0+ | Universal APK |
            | `ScratchJr-android.aab` | Android | Google Play App Bundle |

            ### Checksums (SHA256)

            Download the `.sha256` files alongside each artifact to verify integrity.
