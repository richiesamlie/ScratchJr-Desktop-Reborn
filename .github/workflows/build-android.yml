name: Build Android

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - master
      - mobile/android
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Guard against committed build artifacts
        # assets/www is generated by npm run build:android — the first Android
        # port died by committing ~1000 generated files; never again.
        run: |
          if [ -n "$(git ls-files android/app/src/main/assets)" ]; then
            echo "::error::Committed files under android/app/src/main/assets/ — these are build artifacts. Remove them (they are generated by npm run build:android)."
            git ls-files android/app/src/main/assets
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Node dependencies
        run: npm ci

      - name: Build Web Bundle & Sync Android Assets
        run: npm run build:android

      - name: Grant execute permission for Gradle wrapper
        run: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Build Android APK and Bundle
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Copy & Rename Artifacts
        shell: bash
        run: |
          mkdir -p out-android
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out-android/ \;
          find android/app/build/outputs/bundle -name "*.aab" -exec cp {} out-android/ \;
          if [ -f out-android/app-debug.apk ]; then
            cp out-android/app-debug.apk out-android/ScratchJr-android.apk
          fi
          if [ -f out-android/app-release.aab ]; then
            cp out-android/app-release.aab out-android/ScratchJr-android.aab
          fi
          echo "Generated Android artifacts:"
          ls -la out-android/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ScratchJr-android
          path: out-android/*
          retention-days: 7

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: |
            out-android/*.apk
            out-android/*.aab
