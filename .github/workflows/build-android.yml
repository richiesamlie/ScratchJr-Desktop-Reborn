name: Build Android

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Guard against committed build artifacts
        # assets/www is generated by npm run build:android — the first Android
        # port died by committing ~1000 generated files; never again.
        run: |
          if [ -n "$(git ls-files android/app/src/main/assets)" ]; then
            echo "::error::Committed files under android/app/src/main/assets/ — these are build artifacts. Remove them (they are generated by npm run build:android)."
            git ls-files android/app/src/main/assets
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - name: Install Node dependencies
        run: npm ci

      - name: Build Web Bundle & Sync Android Assets
        run: npm run build:android

      - name: Grant execute permission for Gradle wrapper
        run: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Decode Android Release Keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
            chmod 600 "${RUNNER_TEMP}/release.keystore"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is required for tagged release builds."
            exit 1
          fi

      - name: Build Android APK and Bundle
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Clean up Android Release Keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/release.keystore"

      - name: Copy & Rename Artifacts
        shell: bash
        run: |
          mkdir -p out-android
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out-android/ \;
          find android/app/build/outputs/bundle -name "*.aab" -exec cp {} out-android/ \;
          if [ -f out-android/app-release.apk ]; then
            cp out-android/app-release.apk out-android/ScratchJr-android.apk
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "::error::Signed app-release.apk was not produced for release tag ${GITHUB_REF_NAME}."
            exit 1
          elif [ -f out-android/app-release-unsigned.apk ]; then
            cp out-android/app-release-unsigned.apk out-android/ScratchJr-android.apk
          elif [ -f out-android/app-debug.apk ]; then
            cp out-android/app-debug.apk out-android/ScratchJr-android.apk
          fi
          if [ -f out-android/app-release.aab ]; then
            cp out-android/app-release.aab out-android/ScratchJr-android.aab
          fi
          (
            cd out-android
            if [ -f ScratchJr-android.apk ]; then
              sha256sum ScratchJr-android.apk > ScratchJr-android.apk.sha256
            fi
            if [ -f ScratchJr-android.aab ]; then
              sha256sum ScratchJr-android.aab > ScratchJr-android.aab.sha256
            fi
          )
          echo "Generated Android artifacts:"
          ls -la out-android/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ScratchJr-android
          path: |
            out-android/ScratchJr-android.apk*
            out-android/ScratchJr-android.aab*
          retention-days: 7

  release-android:
    name: Attach Android Release
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android Artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ScratchJr-android
          path: out-android

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: |
            out-android/ScratchJr-android.apk
            out-android/ScratchJr-android.apk.sha256
            out-android/ScratchJr-android.aab
            out-android/ScratchJr-android.aab.sha256
