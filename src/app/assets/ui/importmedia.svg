<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" xml:space="preserve">
	<!-- Drop shadow -->
	<circle opacity="0.2" cx="54" cy="56" r="48"/>
	<!-- White outline badge -->
	<circle fill="#FFFFFF" cx="52" cy="52" r="48"/>
	<!-- Button background circle (Teal/Green #28B088) -->
	<circle fill="#28B088" cx="52" cy="52" r="44"/>
	<circle fill="#32C99C" cx="52" cy="50" r="42"/>
	
	<!-- Photo Frame / Image Card -->
	<g transform="translate(24, 25)">
		<!-- Outer frame -->
		<rect x="2" y="2" width="52" height="42" rx="7" ry="7" fill="#FFFFFF" stroke="#1C7E61" stroke-width="3" />
		<!-- Sky background inside frame -->
		<rect x="5" y="5" width="46" height="36" rx="5" ry="5" fill="#8CE8FF" />
		
		<!-- Sun -->
		<circle cx="15" cy="14" r="5" fill="#FFE552" stroke="#F5A623" stroke-width="1.5"/>
		
		<!-- Mountains inside frame -->
		<path d="M 5 36 L 20 22 L 32 32 L 38 27 L 51 38 L 51 41 L 5 41 Z" fill="#69C848" />
		<path d="M 18 36 L 30 25 L 42 36 L 51 31 L 51 41 L 18 41 Z" fill="#4EA830" opacity="0.8"/>
		
		<!-- Import / Plus badge on bottom-right of frame -->
		<g transform="translate(32, 22)">
			<!-- Badge circle -->
			<circle cx="16" cy="16" r="14" fill="#FFFFFF"/>
			<circle cx="16" cy="16" r="12" fill="#FF8D24"/>
			<!-- Upward Arrow inside badge -->
			<path d="M 16 8 L 10 15 L 13.5 15 L 13.5 23 L 18.5 23 L 18.5 15 L 22 15 Z" fill="#FFFFFF"/>
		</g>
	</g>
</svg>
